name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gateway_test
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://gateway:ci_password@localhost:5432/gateway_test
      APP_TEST_DATABASE_URL: postgresql+asyncpg://gateway:ci_password@localhost:5432/gateway_app_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Create application test database
        run: |
          uv run python - <<'PY'
          import asyncio
          import asyncpg
          async def main():
              connection = await asyncpg.connect(
                  host="localhost", user="gateway", password="ci_password", database="postgres"
              )
              try:
                  await connection.execute("CREATE DATABASE gateway_app_test")
              finally:
                  await connection.close()
          asyncio.run(main())
          PY
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: docker compose config --quiet
