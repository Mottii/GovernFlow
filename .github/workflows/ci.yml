name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for credentials
        run: |
          mkdir -p "$RUNNER_TEMP/governflow-gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/governflow-gitleaks/archive.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' \
            "$RUNNER_TEMP/governflow-gitleaks/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/governflow-gitleaks/archive.tar.gz" \
            -C "$RUNNER_TEMP/governflow-gitleaks" gitleaks
          "$RUNNER_TEMP/governflow-gitleaks/gitleaks" git "$GITHUB_WORKSPACE" \
            --no-banner --redact=100 --log-opts='--all'
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gateway_test
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://gateway:ci_password@localhost:5432/gateway_test
      APP_TEST_DATABASE_URL: postgresql+asyncpg://gateway:ci_password@localhost:5432/gateway_app_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Create application test database
        run: |
          uv run python - <<'PY'
          import asyncio
          import asyncpg
          async def main():
              connection = await asyncpg.connect(
                  host="localhost", user="gateway", password="ci_password", database="postgres"
              )
              try:
                  await connection.execute("CREATE DATABASE gateway_app_test")
              finally:
                  await connection.close()
          asyncio.run(main())
          PY
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: docker compose config --quiet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test sdks/javascript/index.test.mjs
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Start isolated mock services
        run: |
          python - <<'PY'
          import base64, secrets
          from pathlib import Path
          Path('.env').write_text('\n'.join([
              'POSTGRES_PASSWORD=' + secrets.token_urlsafe(24),
              'ADMIN_TOKEN=' + secrets.token_urlsafe(24),
              'MASTER_ENCRYPTION_KEY=' + base64.b64encode(secrets.token_bytes(32)).decode(),
              'DECISION_SIGNING_KEY=' + base64.b64encode(secrets.token_bytes(32)).decode(),
          ]) + '\n')
          PY
          docker compose up -d --build postgres gateway admin-api mock-provider
          docker compose exec -T gateway alembic upgrade head
          uv run python - <<'PY'
          import time, httpx
          for _ in range(30):
              try:
                  if httpx.get('http://localhost:8001/health').is_success:
                      break
              except httpx.HTTPError:
                  pass
              time.sleep(1)
          else:
              raise SystemExit('Admin API did not start')
          PY
      - run: uv run python scripts/seed_e2e.py
        env:
          E2E_SEED_FILE: ${{ github.workspace }}/.e2e.json
      - run: pnpm install --frozen-lockfile
        working-directory: dashboard
      - run: pnpm typecheck && pnpm build
        working-directory: dashboard
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: dashboard
      - run: pnpm test
        working-directory: dashboard
        env:
          E2E_SEED_FILE: ${{ github.workspace }}/.e2e.json
      - run: docker compose down -v
        if: always()
