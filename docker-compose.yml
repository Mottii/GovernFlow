x-keyring-environment: &keyring-environment
  ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:-}
  ACTIVE_ENCRYPTION_KEY_ID: ${ACTIVE_ENCRYPTION_KEY_ID:-0000}
  SIGNING_KEYS: ${SIGNING_KEYS:-}
  ACTIVE_SIGNING_KEY_ID: ${ACTIVE_SIGNING_KEY_ID:-0000}
  DECISION_SIGNING_KEY: ${DECISION_SIGNING_KEY:-}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_password}
    ports:
      - "${POSTGRES_HOST_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  initialize:
    build: .
    command: python -m core.initialize
    environment:
      <<: *keyring-environment
      MAINTENANCE_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-local_only_password}@postgres:5432/gateway
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      TELEGRAM_APPROVER_CHAT_IDS: ${TELEGRAM_APPROVER_CHAT_IDS:-}
      APPROVAL_EMAIL_TO: ${APPROVAL_EMAIL_TO:-}
      APPROVAL_WEBHOOK_URL: ${APPROVAL_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
  maintenance:
    build: .
    profiles: ["maintenance"]
    command: uvicorn admin_api.app:app --host 0.0.0.0 --port 8001
    environment:
      <<: *keyring-environment
      MAINTENANCE_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-local_only_password}@postgres:5432/gateway
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      DECISION_SIGNING_KEY: ${DECISION_SIGNING_KEY:-}
    ports:
      - "127.0.0.1:8003:8001"
    depends_on:
      initialize:
        condition: service_completed_successfully
  gateway:
    build: .
    command: uvicorn gateway.app:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 30
    stop_grace_period: 45s
    environment:
      <<: *keyring-environment
      DATABASE_URL: postgresql+asyncpg://governflow_app:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD to a URL-safe secret of at least 20 characters}@postgres:5432/gateway
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      DECISION_SIGNING_KEY: ${DECISION_SIGNING_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://mock-provider:8002}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-http://mock-provider:8002}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-http://mock-provider:8002}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self_hosted}
      RECOVERY_BACKEND: ${RECOVERY_BACKEND:-sqlite}
      RECOVERY_S3_BUCKET: ${RECOVERY_S3_BUCKET:-}
      RECOVERY_S3_PREFIX: ${RECOVERY_S3_PREFIX:-governflow-recovery}
      RECOVERY_S3_ENDPOINT: ${RECOVERY_S3_ENDPOINT:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      ALLOW_FAIL_OPEN: ${ALLOW_FAIL_OPEN:-false}
      SELF_HOSTED_SINGLE_NODE: ${SELF_HOSTED_SINGLE_NODE:-false}
      DEFAULT_MAX_OUTPUT_TOKENS: ${DEFAULT_MAX_OUTPUT_TOKENS:-4096}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-32768}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-2097152}
      MAX_RESPONSE_BYTES: ${MAX_RESPONSE_BYTES:-16777216}
      MAX_TRACKER_BYTES: ${MAX_TRACKER_BYTES:-2097152}
      GATEWAY_MAX_INFLIGHT: ${GATEWAY_MAX_INFLIGHT:-128}
      WORKFLOW_MAX_INFLIGHT: ${WORKFLOW_MAX_INFLIGHT:-32}
      CALL_DEADLINE_SECONDS: ${CALL_DEADLINE_SECONDS:-300}
      CALL_LEASE_SECONDS: ${CALL_LEASE_SECONDS:-60}
      CALL_RENEW_SECONDS: ${CALL_RENEW_SECONDS:-15}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      REPLAY_QUEUE_PATH: /queue/replay.sqlite3
      UPSTREAM_TIMEOUT_S: ${UPSTREAM_TIMEOUT_S:-120}
      REQUIRE_PROVIDER_MAPPING: ${REQUIRE_PROVIDER_MAPPING:-false}
    ports:
      - "8000:8000"
    volumes:
      - replay_queue:/queue
    depends_on:
      initialize:
        condition: service_completed_successfully
      mock-provider:
        condition: service_started
  admin-api:
    build: .
    command: uvicorn admin_api.app:app --host 0.0.0.0 --port 8001
    environment:
      <<: *keyring-environment
      DATABASE_URL: postgresql+asyncpg://governflow_app:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD to a URL-safe secret of at least 20 characters}@postgres:5432/gateway
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      OPENAI_ADMIN_KEY: ${OPENAI_ADMIN_KEY:-}
      ANTHROPIC_ADMIN_KEY: ${ANTHROPIC_ADMIN_KEY:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      DECISION_SIGNING_KEY: ${DECISION_SIGNING_KEY:-}
    ports:
      - "8001:8001"
    depends_on:
      initialize:
        condition: service_completed_successfully
  reservation-reaper:
    build: .
    command: sh -c "while true; do python -m policy.allocations; python -m policy.reap; python -m policy.replay; python -m admin_api.cleanup; sleep 15; done"
    environment:
      DATABASE_URL: postgresql+asyncpg://governflow_app:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD to a URL-safe secret of at least 20 characters}@postgres:5432/gateway
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self_hosted}
      RECOVERY_BACKEND: ${RECOVERY_BACKEND:-sqlite}
      RECOVERY_S3_BUCKET: ${RECOVERY_S3_BUCKET:-}
      RECOVERY_S3_PREFIX: ${RECOVERY_S3_PREFIX:-governflow-recovery}
      RECOVERY_S3_ENDPOINT: ${RECOVERY_S3_ENDPOINT:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      REPLAY_QUEUE_PATH: /queue/replay.sqlite3
    volumes:
      - replay_queue:/queue
    depends_on:
      initialize:
        condition: service_completed_successfully
  reconciler:
    build: .
    command: sh -c "while true; do python -m reconcile.service; sleep 86400; done"
    environment:
      DATABASE_URL: postgresql+asyncpg://governflow_app:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD to a URL-safe secret of at least 20 characters}@postgres:5432/gateway
      OPENAI_ADMIN_KEY: ${OPENAI_ADMIN_KEY:-}
      ANTHROPIC_ADMIN_KEY: ${ANTHROPIC_ADMIN_KEY:-}
      DRIFT_COST_TOLERANCE_MICRO: ${DRIFT_COST_TOLERANCE_MICRO:-1}
      DRIFT_TOKEN_TOLERANCE: ${DRIFT_TOKEN_TOLERANCE:-0}
    depends_on:
      initialize:
        condition: service_completed_successfully
  approval-notifier:
    build: .
    command: sh -c "while true; do python -m approvals.expiry; python -m approvals.notifications; sleep 30; done"
    environment:
      <<: *keyring-environment
      DATABASE_URL: postgresql+asyncpg://governflow_app:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD to a URL-safe secret of at least 20 characters}@postgres:5432/gateway
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      DECISION_SIGNING_KEY: ${DECISION_SIGNING_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://localhost:8001}
      PUBLIC_DASHBOARD_URL: ${DASHBOARD_PUBLIC_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
    depends_on:
      initialize:
        condition: service_completed_successfully
  dashboard:
    build: ./dashboard
    environment:
      ADMIN_API_URL: http://admin-api:8001
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      admin-api:
        condition: service_started

  mock-provider:
    build: .
    command: uvicorn mock_provider.app:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
volumes:
  postgres_data:
  replay_queue:
