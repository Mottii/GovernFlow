services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_password}
    ports:
      - "${POSTGRES_HOST_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  gateway:
    build: .
    command: uvicorn gateway.app:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-local_only_password}@postgres:5432/gateway
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      DECISION_SIGNING_KEY: ${DECISION_SIGNING_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://mock-provider:8002}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-http://mock-provider:8002}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-http://mock-provider:8002}
      REPLAY_QUEUE_PATH: /queue/replay.sqlite3
      UPSTREAM_TIMEOUT_S: ${UPSTREAM_TIMEOUT_S:-120}
    ports:
      - "8000:8000"
    volumes:
      - replay_queue:/queue
    depends_on:
      postgres:
        condition: service_healthy
      mock-provider:
        condition: service_started
  admin-api:
    build: .
    command: uvicorn admin_api.app:app --host 0.0.0.0 --port 8001
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-local_only_password}@postgres:5432/gateway
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      WEBHOOK_SIGNING_KEY: ${WEBHOOK_SIGNING_KEY:-}
      TELEGRAM_APPROVER_CHAT_IDS: ${TELEGRAM_APPROVER_CHAT_IDS:-}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      DECISION_SIGNING_KEY: ${DECISION_SIGNING_KEY:-}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
  reservation-reaper:
    build: .
    command: sh -c "while true; do python -m policy.reap; python -m policy.replay; sleep 60; done"
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-local_only_password}@postgres:5432/gateway
      REPLAY_QUEUE_PATH: /queue/replay.sqlite3
    volumes:
      - replay_queue:/queue
    depends_on:
      postgres:
        condition: service_healthy
  approval-notifier:
    build: .
    command: sh -c "while true; do python -m approvals.expiry; python -m approvals.notifications; sleep 30; done"
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-local_only_password}@postgres:5432/gateway
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      DECISION_SIGNING_KEY: ${DECISION_SIGNING_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_APPROVER_CHAT_IDS: ${TELEGRAM_APPROVER_CHAT_IDS:-}
      PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://localhost:8001}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      APPROVAL_EMAIL_TO: ${APPROVAL_EMAIL_TO:-}
      APPROVAL_WEBHOOK_URL: ${APPROVAL_WEBHOOK_URL:-}
      WEBHOOK_SIGNING_KEY: ${WEBHOOK_SIGNING_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
  mock-provider:
    build: .
    command: uvicorn mock_provider.app:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
volumes:
  postgres_data:
  replay_queue:
