services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_password}
    ports:
      - "${POSTGRES_HOST_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  gateway:
    build: .
    command: uvicorn gateway.app:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-local_only_password}@postgres:5432/gateway
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      OPENAI_BASE_URL: http://mock-provider:8002
      ANTHROPIC_BASE_URL: http://mock-provider:8002
      UPSTREAM_TIMEOUT_S: ${UPSTREAM_TIMEOUT_S:-120}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mock-provider:
        condition: service_started
  admin-api:
    build: .
    command: uvicorn admin_api.app:app --host 0.0.0.0 --port 8001
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-local_only_password}@postgres:5432/gateway
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
  reservation-reaper:
    build: .
    command: sh -c "while true; do python -m policy.reap; sleep 86400; done"
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-local_only_password}@postgres:5432/gateway
    depends_on:
      postgres:
        condition: service_healthy
  mock-provider:
    build: .
    command: uvicorn mock_provider.app:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
volumes:
  postgres_data:
