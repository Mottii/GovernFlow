[project]
name = "governed-automation-starter"
version = "0.1.0"
description = "Governance gateway for AI automation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "cryptography>=46,<47",
  "fastapi>=0.118,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.11,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.37,<1",
]

[dependency-groups]
dev = [
  "anthropic>=1.11.0",
  "mypy>=1.18,<2",
  "openai>=3.24.0",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "respx>=0.22,<1",
  "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway", "policy", "approvals", "audit", "reconcile", "admin_api", "core", "mock_provider"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gateway", "policy", "approvals", "audit", "reconcile", "admin_api", "core", "mock_provider"]
